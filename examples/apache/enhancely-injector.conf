# Apache httpd in front of the Enhancely sidecar (@enhancely/adapter-sidecar).
#
#   visitor → Apache (TLS, :443) → enhancely sidecar (:8080) → your origin
#
# Apache terminates TLS and forwards EVERY request to the sidecar. The
# HTML-only logic lives in the sidecar, not here: only 2xx `text/html`
# responses get the JSON-LD snippet injected before </head>; everything else
# (assets, JSON, redirects, errors, compressed bodies) passes through
# unchanged (fail-open). No <If>/content-type conditionals needed in Apache.
#
# Required modules:
#   a2enmod proxy proxy_http headers ssl
#
# Drop into sites-available/, adjust names/certs, a2ensite + reload.

<VirtualHost *:443>
    ServerName www.example.com

    SSLEngine on
    SSLCertificateFile      /etc/apache2/certs/example.com.fullchain.pem
    SSLCertificateKeyFile   /etc/apache2/certs/example.com.key.pem

    # Forward the ORIGINAL Host header to the sidecar (the equivalent of
    # nginx's `proxy_set_header Host $host`) — the sidecar uses it to
    # reconstruct the public page URL it sends to the Enhancely API.
    ProxyPreserveHost On

    # X-Forwarded-For and X-Forwarded-Host are added automatically by
    # mod_proxy; the proto hint needs to be explicit:
    RequestHeader set X-Forwarded-Proto "https"

    # The sidecar cannot inject into compressed bodies (it passes them
    # through unchanged) — request identity encoding from the origin chain
    # and let Apache compress towards the visitor (mod_deflate) if desired.
    RequestHeader unset Accept-Encoding

    # Everything goes to the sidecar (UPSTREAM_ORIGIN there points at your
    # real origin). ProxyPassReverse rewrites Location/Refresh headers on
    # redirects coming back from the sidecar/origin.
    ProxyPass        "/" "http://127.0.0.1:8080/"
    ProxyPassReverse "/" "http://127.0.0.1:8080/"
</VirtualHost>

# Optional: redirect plain HTTP to HTTPS.
<VirtualHost *:80>
    ServerName www.example.com
    Redirect permanent "/" "https://www.example.com/"
</VirtualHost>
