# nginx in front of the Enhancely sidecar (@enhancely/adapter-sidecar).
#
#   visitor → nginx (TLS, :443) → enhancely sidecar (:8080) → your origin
#
# nginx terminates TLS and forwards EVERY request to the sidecar. The sidecar
# decides what to touch: only 2xx `text/html` responses get the JSON-LD
# snippet injected before </head>; everything else (assets, JSON, redirects,
# errors, compressed bodies) streams through byte-for-byte unchanged
# (fail-open). That is why this config needs no content-type conditionals —
# the HTML-only gate lives in the sidecar, not in nginx.
#
# Include this file from your http {} block, adjust names/certs, reload.

upstream enhancely_sidecar {
    # The sidecar (UPSTREAM_ORIGIN there points at your real origin).
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/nginx/certs/example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/example.com.key.pem;

    # IMPORTANT: do not gzip between origin/sidecar layers — the sidecar
    # cannot inject into compressed bodies (it passes them through). Let
    # nginx compress towards the visitor instead:
    gzip on;
    gzip_types text/html application/json text/css application/javascript;

    location / {
        proxy_pass http://enhancely_sidecar;

        # Preserve the original request identity — the sidecar uses these to
        # reconstruct the public page URL it sends to the Enhancely API.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Sidecar speaks plain HTTP/1.1; keepalive needs this pair.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Ask the ORIGIN for identity encoding via the sidecar so injection
        # can happen; nginx re-compresses towards the visitor (gzip above).
        proxy_set_header Accept-Encoding "";
    }
}

# Optional: redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name www.example.com;
    return 301 https://$host$request_uri;
}
