name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version is taken from "packageManager" in package.json

      # setup-node's pnpm cache requires a lockfile; skip caching until
      # pnpm-lock.yaml is committed (setup-node hard-fails otherwise).
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
        with:
          node-version-file: .nvmrc

      # The first CI runs predate a committed pnpm-lock.yaml; fall back to a
      # plain install until the lockfile lands, then --frozen-lockfile applies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      # Workspace adapters resolve injector-core through its emitted package
      # declarations. A clean runner must build the core before typechecking
      # those consumers; local worktrees can otherwise hide this with stale
      # dist files.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/modules/lambda-edge-injector
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Initialize
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate -no-color

      - name: Test
        run: tofu test -no-color
