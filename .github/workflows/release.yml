name: release

# Cut a versioned release from a tag: build, test, package the Lambda@Edge
# bundles and attach them (plus checksums) as release assets. Integrators vendor
# the artifact by version + SHA256 — see README "Consuming releases".
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: |
          pnpm -r build
          pnpm -r typecheck
          pnpm -r test
          pnpm lint
          pnpm format:check
          pnpm verify:lambda-bundles

      - name: Terraform module gate
        working-directory: infra/modules/lambda-edge-injector
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate -no-color
          tofu test -no-color

      - name: Package Lambda@Edge bundle
        run: |
          pnpm --filter @enhancely/adapter-lambda-edge package
          mkdir -p release-assets
          # Origin-request injector. Shipped as
          # index.js inside its zip so the Lambda handler stays index.handler.
          cp packages/adapter-lambda-edge/dist/origin-request.js \
             release-assets/lambda-edge-origin-request-index.js
          rm -rf packages/adapter-lambda-edge/dist/.rel-or
          mkdir -p packages/adapter-lambda-edge/dist/.rel-or
          cp packages/adapter-lambda-edge/dist/origin-request.js \
             packages/adapter-lambda-edge/dist/.rel-or/index.js
          cd packages/adapter-lambda-edge/dist/.rel-or && zip -q -X ../release-or.zip index.js && cd -
          cp packages/adapter-lambda-edge/dist/release-or.zip \
             release-assets/lambda-edge-origin-request-bundle.zip
          # companion entrypoint (origin-response, pairs WITH origin-request:
          # cache-lifetime cap only; no injection, origin fetch or API call). Same
          # index.js-inside-zip convention so the handler stays index.handler.
          cp packages/adapter-lambda-edge/dist/companion.js \
             release-assets/lambda-edge-companion-index.js
          rm -rf packages/adapter-lambda-edge/dist/.rel-comp
          mkdir -p packages/adapter-lambda-edge/dist/.rel-comp
          cp packages/adapter-lambda-edge/dist/companion.js \
             packages/adapter-lambda-edge/dist/.rel-comp/index.js
          cd packages/adapter-lambda-edge/dist/.rel-comp && zip -q -X ../release-comp.zip index.js && cd -
          cp packages/adapter-lambda-edge/dist/release-comp.zip \
             release-assets/lambda-edge-companion-bundle.zip

      - name: Verify Terraform module bundles are in sync
        run: |
          if ! diff -q packages/adapter-lambda-edge/dist/origin-request.js infra/modules/lambda-edge-injector/dist/origin-request.js \
            || ! diff -q packages/adapter-lambda-edge/dist/companion.js infra/modules/lambda-edge-injector/dist/companion.js; then
            echo "::error::A Terraform module bundle is stale — run 'pnpm sync:module' and commit both module entrypoints before tagging."
            exit 1
          fi

      - name: Checksums
        run: |
          cd release-assets
          sha256sum lambda-edge-origin-request-index.js \
                    lambda-edge-origin-request-bundle.zip \
                    lambda-edge-companion-index.js \
                    lambda-edge-companion-bundle.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            release-assets/lambda-edge-origin-request-index.js \
            release-assets/lambda-edge-origin-request-bundle.zip \
            release-assets/lambda-edge-companion-index.js \
            release-assets/lambda-edge-companion-bundle.zip \
            release-assets/SHA256SUMS
